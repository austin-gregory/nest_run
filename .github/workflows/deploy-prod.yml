name: Deploy to Hostinger (prod)

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/nest_run-app
  NGINX_IMAGE: ghcr.io/${{ github.repository_owner }}/nest_run-nginx

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.APP_IMAGE }}:latest,${{ env.APP_IMAGE }}:${{ github.sha }}

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: NGINX_CONF=nginx.conf
          tags: ${{ env.NGINX_IMAGE }}:latest,${{ env.NGINX_IMAGE }}:${{ github.sha }}

      - name: Deploy to Hostinger VPS
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "$PROD_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no $PROD_SSH_USER@$PROD_SSH_HOST"
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no docker-compose.prod.yml $PROD_SSH_USER@$PROD_SSH_HOST:/docker/nest-run/
          $SSH "
            cd /docker/nest-run &&
            echo '$GITHUB_TOKEN' | docker login ghcr.io -u $ACTOR --password-stdin &&
            SUPABASE_URL='$SUPABASE_URL' \
            SUPABASE_SERVICE_ROLE_KEY='$SUPABASE_SERVICE_ROLE_KEY' \
            SUPABASE_ANON_KEY='$SUPABASE_ANON_KEY' \
            docker compose -f docker-compose.prod.yml pull &&
            SUPABASE_URL='$SUPABASE_URL' \
            SUPABASE_SERVICE_ROLE_KEY='$SUPABASE_SERVICE_ROLE_KEY' \
            SUPABASE_ANON_KEY='$SUPABASE_ANON_KEY' \
            docker compose -f docker-compose.prod.yml up -d
          "
          rm /tmp/deploy_key
