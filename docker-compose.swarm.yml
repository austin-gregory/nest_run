services:
  app:
    image: ${APP_IMAGE}
    expose:
      - "8000"
    environment:
      - PORT=8000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  nginx:
    image: ${NGINX_IMAGE}
    ports:
      - "80:80"
    depends_on:
      - app
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
