<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nest Run — Lobby</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;background:#05070a;color:#fff;font-family:'Courier New',Courier,monospace;overflow:auto}

    #bg-canvas{
      position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;
      pointer-events:none;
    }

    #lobby{
      position:relative;z-index:1;
      max-width:700px;margin:0 auto;padding:40px 20px;
      display:flex;flex-direction:column;align-items:center;gap:28px;
    }

    h1{
      font-size:48px;letter-spacing:8px;color:#00b4ff;
      text-shadow:0 0 30px rgba(0,180,255,.3);
      margin-bottom:0;
    }
    .subtitle{font-size:13px;color:#556;letter-spacing:.2em;text-transform:uppercase}

    /* ── Role selector ─────────────────────────────────────── */
    .role-section{
      display:flex;flex-direction:column;align-items:center;gap:10px;
      width:100%;
    }
    .role-label{font-size:11px;letter-spacing:.2em;color:rgba(0,190,255,.5);text-transform:uppercase}
    .role-btns{display:flex;gap:12px}
    .role-btn{
      padding:14px 32px;font-size:16px;font-family:inherit;
      background:rgba(255,255,255,.04);color:#aaa;
      border:1px solid rgba(255,255,255,.12);border-radius:6px;
      cursor:pointer;letter-spacing:3px;transition:all .15s;
    }
    .role-btn:hover{background:rgba(0,180,255,.08);border-color:rgba(0,180,255,.3);color:#fff}
    .role-btn.active{
      background:rgba(0,180,255,.15);border-color:#00b4ff;color:#00e0ff;
      box-shadow:0 0 16px rgba(0,180,255,.2);
    }

    /* ── Create room ───────────────────────────────────────── */
    .create-section{
      display:flex;flex-direction:column;align-items:center;gap:10px;
      width:100%;
    }
    .create-row{display:flex;gap:10px;align-items:center}
    .create-input{
      padding:10px 14px;font-size:14px;font-family:inherit;
      background:rgba(255,255,255,.04);color:#fff;
      border:1px solid rgba(255,255,255,.12);border-radius:4px;
      outline:none;width:240px;letter-spacing:1px;
    }
    .create-input::placeholder{color:#445}
    .create-input:focus{border-color:rgba(0,180,255,.4)}
    .create-btn{
      padding:10px 24px;font-size:14px;font-family:inherit;
      background:#c0000a;color:#fff;border:none;border-radius:4px;
      cursor:pointer;letter-spacing:3px;transition:background .15s;
    }
    .create-btn:hover{background:#e0101a}
    .create-btn:disabled{background:#333;color:#666;cursor:not-allowed}

    /* ── Room list ─────────────────────────────────────────── */
    .rooms-section{
      width:100%;
      background:rgba(2,10,22,.7);
      border:1px solid rgba(0,180,255,.15);border-radius:6px;
      padding:16px;
    }
    .rooms-header{
      font-size:11px;letter-spacing:.2em;color:rgba(0,190,255,.5);
      text-transform:uppercase;margin-bottom:12px;
    }
    .rooms-empty{color:#445;font-size:13px;text-align:center;padding:20px 0}
    .room-item{
      display:flex;align-items:center;justify-content:space-between;
      padding:10px 14px;margin-bottom:6px;
      background:rgba(255,255,255,.02);
      border:1px solid rgba(255,255,255,.06);border-radius:4px;
      cursor:pointer;transition:all .15s;
    }
    .room-item:hover{background:rgba(0,180,255,.06);border-color:rgba(0,180,255,.2)}
    .room-item.disabled{opacity:.35;cursor:not-allowed}
    .room-item.disabled:hover{background:rgba(255,255,255,.02);border-color:rgba(255,255,255,.06)}
    .room-name{font-size:14px;font-weight:700;letter-spacing:1px}
    .room-info{display:flex;gap:14px;align-items:center;font-size:12px}
    .slot{padding:2px 8px;border-radius:3px;font-size:11px;letter-spacing:1px}
    .slot.open{color:#00e87a;border:1px solid rgba(0,232,122,.3)}
    .slot.filled{color:#666;border:1px solid rgba(255,255,255,.08)}

    .rules-link{
      font-size:13px;color:#00b4ff;letter-spacing:.15em;
      text-decoration:none;border-bottom:1px solid rgba(0,180,255,.3);
      padding-bottom:2px;transition:color .15s;
    }
    .rules-link:hover{color:#00e0ff}

    /* ── Auth section ─────────────────────────────────────── */
    .auth-section{
      width:100%;
      background:rgba(2,10,22,.7);
      border:1px solid rgba(0,180,255,.15);border-radius:6px;
      padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;
    }
    .auth-section .auth-label{
      font-size:11px;letter-spacing:.2em;color:rgba(0,190,255,.5);text-transform:uppercase;
    }
    .auth-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
    .auth-input{
      padding:8px 12px;font-size:13px;font-family:inherit;
      background:rgba(255,255,255,.04);color:#fff;
      border:1px solid rgba(255,255,255,.12);border-radius:4px;
      outline:none;width:180px;letter-spacing:1px;
    }
    .auth-input::placeholder{color:#445}
    .auth-input:focus{border-color:rgba(0,180,255,.4)}
    .auth-btn{
      padding:8px 18px;font-size:12px;font-family:inherit;
      background:rgba(0,180,255,.15);color:#00b4ff;
      border:1px solid rgba(0,180,255,.3);border-radius:4px;
      cursor:pointer;letter-spacing:2px;transition:all .15s;
    }
    .auth-btn:hover{background:rgba(0,180,255,.25);color:#00e0ff}
    .auth-btn.danger{background:rgba(255,60,60,.1);color:#f66;border-color:rgba(255,60,60,.3)}
    .auth-btn.danger:hover{background:rgba(255,60,60,.2)}
    .auth-msg{font-size:12px;color:#e84000;min-height:16px;text-align:center}
    .auth-toggle{font-size:11px;color:#556;cursor:pointer;text-decoration:underline}
    .auth-toggle:hover{color:#00b4ff}

    /* ── Stats display ────────────────────────────────────── */
    .stats-bar{
      display:flex;gap:16px;flex-wrap:wrap;justify-content:center;
      font-size:12px;color:#aab;letter-spacing:1px;
    }
    .stat-item{display:flex;flex-direction:column;align-items:center;gap:2px}
    .stat-val{font-size:18px;font-weight:700;color:#00e0ff}
    .stat-label{font-size:10px;color:rgba(0,190,255,.5);text-transform:uppercase;letter-spacing:.15em}
    .user-greeting{font-size:14px;color:#00e87a;letter-spacing:1px}

    .error-msg{color:#e84000;font-size:13px;min-height:18px;text-align:center}
    .gp-focus{box-shadow:0 0 12px rgba(0,180,255,.7);border-color:#00b4ff !important;outline:none}

    /* ── Customization modal ──────────────────────────────── */
    #customize-modal{
      display:none;position:fixed;inset:0;z-index:100;
      background:rgba(0,0,0,.92);
      font-family:'Courier New',Courier,monospace;color:#fff;
    }
    #customize-modal.open{display:flex;align-items:center;justify-content:center}
    .cust-container{
      display:flex;gap:24px;max-width:800px;width:95%;max-height:90vh;
    }
    .cust-preview{
      flex:1;min-width:250px;position:relative;
      background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:6px;
      overflow:hidden;
    }
    .cust-preview canvas{width:100%!important;height:100%!important;display:block}
    .cust-panel{
      flex:1;min-width:250px;display:flex;flex-direction:column;gap:12px;
      overflow-y:auto;padding:10px 0;
    }
    .cust-title{font-size:18px;letter-spacing:4px;color:#00b4ff;text-align:center}
    .cust-zone{
      display:flex;align-items:center;gap:10px;
      padding:8px 12px;background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.08);border-radius:4px;
    }
    .cust-zone.active{border-color:rgba(0,180,255,.4);background:rgba(0,180,255,.06)}
    .cust-zone-label{flex:1;font-size:13px;letter-spacing:1px;text-transform:uppercase}
    .cust-zone input[type="color"]{
      width:36px;height:28px;border:1px solid rgba(255,255,255,.2);
      border-radius:3px;background:transparent;cursor:pointer;padding:0;
    }
    .cust-zone input[type="checkbox"]{cursor:pointer}
    .cust-base-row{
      display:flex;align-items:center;gap:10px;justify-content:center;
      padding:10px;background:rgba(0,180,255,.06);
      border:1px solid rgba(0,180,255,.2);border-radius:4px;
    }
    .cust-base-row label{font-size:12px;letter-spacing:2px;color:#00b4ff;text-transform:uppercase}
    .cust-base-row input[type="color"]{
      width:48px;height:32px;border:1px solid rgba(0,180,255,.3);
      border-radius:3px;background:transparent;cursor:pointer;padding:0;
    }
    .cust-btns{display:flex;gap:10px;justify-content:center;margin-top:8px}
    .cust-btn{
      padding:8px 20px;font-size:12px;font-family:inherit;
      background:rgba(0,180,255,.15);color:#00b4ff;
      border:1px solid rgba(0,180,255,.3);border-radius:4px;
      cursor:pointer;letter-spacing:2px;transition:all .15s;
    }
    .cust-btn:hover{background:rgba(0,180,255,.25);color:#00e0ff}
    .cust-btn.save{background:rgba(0,232,122,.15);color:#00e87a;border-color:rgba(0,232,122,.3)}
    .cust-btn.save:hover{background:rgba(0,232,122,.25)}
    .cust-btn.close{background:rgba(255,60,60,.1);color:#f66;border-color:rgba(255,60,60,.3)}
    .cust-btn.close:hover{background:rgba(255,60,60,.2)}
    .cust-msg{font-size:11px;color:#00e87a;text-align:center;min-height:14px}

    @media(max-width:640px){
      .cust-container{flex-direction:column}
      .cust-preview{min-height:250px}
    }

    /* ── Music toggle ──────────────────────────────────────── */
    #music-toggle{
      position:fixed;bottom:16px;left:16px;z-index:10;
      width:42px;height:42px;border-radius:50%;
      background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);
      color:#aaa;font-size:20px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:all .15s;
    }
    #music-toggle:hover{background:rgba(0,180,255,.15);border-color:rgba(0,180,255,.3);color:#fff}
    #music-toggle.muted{color:#555}

    /* ── Gamepad indicator ────────────────────────────────── */
    #gamepad-indicator{
      position:fixed;bottom:16px;right:16px;z-index:10;
      height:42px;border-radius:21px;padding:0 14px;
      background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);
      font-size:13px;color:#555;cursor:default;
      display:flex;align-items:center;gap:8px;
      font-family:'Courier New',Courier,monospace;letter-spacing:.05em;
      transition:all .3s;
    }
    #gamepad-indicator .gp-icon{font-size:20px}
    #gamepad-indicator.connected{color:#00e87a;border-color:rgba(0,232,122,.4);box-shadow:0 0 10px rgba(0,232,122,.2)}
  </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div id="lobby">
  <h1>NEST RUN</h1>
  <!-- Auth / Account -->
  <div class="auth-section" id="auth-section">
    <!-- Login form (shown when logged out) -->
    <div id="auth-form">
      <div class="auth-label">Account</div>
      <div style="font-size:10px;color:#445;letter-spacing:.1em;margin-bottom:6px;text-align:center">
        Login to track scores &amp; customize your character
      </div>
      <div class="auth-row" id="auth-name-row" style="display:none">
        <input class="auth-input" id="auth-name" type="text" placeholder="Display name" maxlength="20" />
      </div>
      <div class="auth-row">
        <input class="auth-input" id="auth-email" type="email" placeholder="Email" />
        <input class="auth-input" id="auth-pass" type="password" placeholder="Password" />
      </div>
      <div class="auth-row">
        <button class="auth-btn" id="btn-login">LOGIN</button>
        <button class="auth-btn" id="btn-signup">SIGN UP</button>
      </div>
      <div class="auth-msg" id="auth-msg"></div>
    </div>

    <!-- Logged in view (shown when authenticated) -->
    <div id="auth-user" style="display:none">
      <div class="user-greeting" id="user-greeting"></div>
      <div class="stats-bar" id="stats-bar">
        <div class="stat-item"><span class="stat-val" id="stat-games">-</span><span class="stat-label">Games</span></div>
        <div class="stat-item"><span class="stat-val" id="stat-shooter-wins">-</span><span class="stat-label">Shooter Wins</span></div>
        <div class="stat-item"><span class="stat-val" id="stat-commander-wins">-</span><span class="stat-label">Commander Wins</span></div>
        <div class="stat-item"><span class="stat-val" id="stat-kills">-</span><span class="stat-label">Kills</span></div>
        <div class="stat-item"><span class="stat-val" id="stat-deaths">-</span><span class="stat-label">Deaths</span></div>
      </div>
      <div class="auth-row" style="margin-top:8px">
        <button class="auth-btn" id="btn-customize">CUSTOMIZE SHOOTER</button>
        <button class="auth-btn danger" id="btn-logout">LOGOUT</button>
      </div>
    </div>
  </div>

  <!-- Role selector -->
  <div class="role-section">
    <div class="role-label">Co-op vs AI — 4v1 PvP</div>
    <div class="role-btns">
      <button class="role-btn" data-role="fps" id="btn-fps">SHOOTER</button>
      <button class="role-btn" data-role="rts" id="btn-rts">COMMANDER</button>
    </div>
    <div class="role-label" style="margin-top:16px">Free-For-All</div>
    <div class="role-btns">
      <button class="role-btn" data-role="arena" id="btn-arena">JETPACK ARENA</button>
    </div>
  </div>

  <!-- Create room -->
  <div class="create-section">
    <div class="create-row">
      <input class="create-input" id="room-name-input" type="text" placeholder="Room name (optional)" maxlength="30" />
      <button class="create-btn" id="btn-create" disabled>CREATE ROOM</button>
    </div>
  </div>

  <div class="error-msg" id="error-msg"></div>

  <!-- Room list -->
  <div class="rooms-section">
    <div class="rooms-header" id="rooms-header">Available Rooms</div>
    <div id="room-list">
      <div class="rooms-empty">No rooms available. Create one!</div>
    </div>
  </div>

  <a href="rules.html" class="rules-link">RULES</a>
</div>

<!-- 3D background flyby -->
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

(function initBgScene() {
  const canvas = document.getElementById("bg-canvas");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2d1f16);
  scene.fog = new THREE.Fog(0x2d1f16, 80, 400);

  const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.5, 600);

  // Lighting (matches game)
  scene.add(new THREE.HemisphereLight(0xffc98a, 0x2a1b13, 0.62));
  const sun = new THREE.DirectionalLight(0xffb15c, 1.35);
  sun.position.set(120, 180, 30);
  scene.add(sun);

  // ── Seeded PRNG ──
  function mulberry32(seed) {
    let s = seed | 0;
    return function() {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry32(42069);

  // ── Track path ──
  const TRACK_WAYPOINTS = [
    { x: -120, y: 0, z: 170 },
    { x: -120, y: 0, z: 105 },
    { x:  120, y: 0, z: 85 },
    { x:  120, y: 0, z: 25 },
    { x: -120, y: 0, z: 5 },
    { x: -120, y: 0, z: -60 },
    { x:  120, y: 0, z: -80 },
    { x:  120, y: 0, z: -140 },
    { x: -120, y: 0, z: -160 },
  ];
  const waypoints = TRACK_WAYPOINTS.map(p => new THREE.Vector3(p.x, p.y, p.z));
  const trackPath = new THREE.CatmullRomCurve3(waypoints, false, "catmullrom", 0.5);
  const trackLength = trackPath.getLength();

  // Pre-compute track samples
  const TRACK_SAMPLES = 200;
  const trackSamples = [];
  for (let i = 0; i <= TRACK_SAMPLES; i++) {
    const t = i / TRACK_SAMPLES;
    const pt = trackPath.getPointAt(t);
    trackSamples.push({ t, x: pt.x, z: pt.z });
  }

  function distToTrackSq(x, z) {
    let best = Infinity;
    for (const s of trackSamples) {
      const d = (s.x - x) ** 2 + (s.z - z) ** 2;
      if (d < best) best = d;
    }
    return best;
  }

  // ── Terrain height ──
  const TRACK_FLATTEN_RADIUS = 14;
  const TRACK_FLATTEN_RADIUS_SQ = TRACK_FLATTEN_RADIUS * TRACK_FLATTEN_RADIUS;
  const gy = (x, z) => {
    const base = (Math.sin(x * 0.04) + Math.cos(z * 0.037)) * 0.8;
    const dSq = distToTrackSq(x, z);
    if (dSq < TRACK_FLATTEN_RADIUS_SQ) {
      const blend = Math.sqrt(dSq) / TRACK_FLATTEN_RADIUS;
      return base * blend * blend;
    }
    return base;
  };

  // ── Terrain mesh ──
  const terrainGeo = new THREE.PlaneGeometry(1000, 1000, 120, 120);
  terrainGeo.rotateX(-Math.PI / 2);
  const tp = terrainGeo.attributes.position;
  for (let i = 0; i < tp.count; i++) {
    tp.setY(i, gy(tp.getX(i), tp.getZ(i)));
  }
  terrainGeo.computeVertexNormals();
  const sandTex = new THREE.TextureLoader().load("./assets/sand.png");
  sandTex.wrapS = THREE.RepeatWrapping;
  sandTex.wrapT = THREE.RepeatWrapping;
  sandTex.repeat.set(26, 26);
  sandTex.colorSpace = THREE.SRGBColorSpace;
  scene.add(new THREE.Mesh(terrainGeo,
    new THREE.MeshStandardMaterial({ color: 0x8a7d68, roughness: 1, metalness: 0, map: sandTex })
  ));

  // ── Rails ──
  const railMat = new THREE.MeshStandardMaterial({ color: 0x69778b, roughness: 0.55, metalness: 0.7 });
  const RAIL_SEG_LEN = 2;
  const railSegCount = Math.ceil(trackLength / RAIL_SEG_LEN);
  const railGeo = new THREE.BoxGeometry(0.35, 0.18, RAIL_SEG_LEN + 0.1);
  for (let i = 0; i < railSegCount; i++) {
    const t = (i + 0.5) / railSegCount;
    const pt = trackPath.getPointAt(t);
    const tan = trackPath.getTangentAt(t);
    const angle = Math.atan2(tan.x, tan.z);
    const perpX = Math.cos(angle);
    const perpZ = -Math.sin(angle);
    for (const side of [-2, 2]) {
      const rx = pt.x + perpX * side;
      const rz = pt.z + perpZ * side;
      const rail = new THREE.Mesh(railGeo, railMat);
      rail.position.set(rx, gy(rx, rz) + 0.17, rz);
      rail.rotation.y = angle;
      scene.add(rail);
    }
  }

  // ── Sleepers ──
  const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x3c2b22, roughness: 1 });
  const sleeperGeo = new THREE.BoxGeometry(5.2, 0.25, 0.55);
  const SLEEPER_SPACING = 4;
  const sleeperCount = Math.floor(trackLength / SLEEPER_SPACING);
  for (let i = 0; i <= sleeperCount; i++) {
    const t = i / sleeperCount;
    const pt = trackPath.getPointAt(t);
    const tan = trackPath.getTangentAt(t);
    const sleeper = new THREE.Mesh(sleeperGeo, sleeperMat);
    sleeper.position.set(pt.x, gy(pt.x, pt.z) + 0.1, pt.z);
    sleeper.rotation.y = Math.atan2(tan.x, tan.z);
    scene.add(sleeper);
  }

  // ── Rocks (perimeter ring) ──
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x3a332c, roughness: 0.98, metalness: 0.02 });
  const cliffMat = new THREE.MeshStandardMaterial({ color: 0x2d2823, roughness: 1, metalness: 0 });
  const NEST_X = -120, NEST_Z = -180;
  const nestClearRadius = 42;

  for (let i = 0; i < 96; i++) {
    const a = (i / 96) * Math.PI * 2;
    const radius = 240 + Math.sin(i * 0.9) * 6 + (rand() - 0.5) * 8;
    const x = Math.cos(a) * radius;
    const z = Math.sin(a) * radius * 0.96;
    if (Math.hypot(x - NEST_X, z - NEST_Z) < nestClearRadius) continue;
    const h = 7 + rand() * 9;
    const sx = 5 + rand() * 4, sz = 5 + rand() * 4;
    const g = new THREE.DodecahedronGeometry(1, 0);
    g.scale(sx, h, sz);
    const m = new THREE.Mesh(g, rockMat);
    m.rotation.set((rand() - 0.5) * 0.35, a + Math.PI * 0.5, (rand() - 0.5) * 0.25);
    m.position.set(x, gy(x, z) + h * 0.9, z);
    scene.add(m);
    if (rand() < 0.28) {
      const sx2 = 4 + rand() * 3, h2 = h + 5 + rand() * 8, sz2 = 4 + rand() * 3;
      const g2 = new THREE.DodecahedronGeometry(1, 0);
      g2.scale(sx2, h2, sz2);
      const m2 = new THREE.Mesh(g2, rockMat);
      const x2 = x * 0.95 + (rand() - 0.5) * 4;
      const z2 = z * 0.95 + (rand() - 0.5) * 4;
      m2.rotation.set((rand() - 0.5) * 0.35, a, (rand() - 0.5) * 0.25);
      m2.position.set(x2, gy(x2, z2) + h2 * 0.9, z2);
      scene.add(m2);
    }
  }

  // Cliff chunks
  for (let i = 0; i < 28; i++) {
    const a = (i / 28) * Math.PI * 2 + rand() * 0.2;
    const radius = 230 + rand() * 10;
    const sx = 12 + rand() * 10, sy = 14 + rand() * 18, sz = 8 + rand() * 9;
    const x = Math.cos(a) * radius;
    const z = Math.sin(a) * radius * 0.94;
    if (Math.hypot(x - NEST_X, z - NEST_Z) < nestClearRadius + 10) continue;
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), cliffMat);
    m.rotation.y = a + rand() * 0.6;
    m.position.set(x, gy(x, z) + sy * 0.5, z);
    scene.add(m);
  }

  // ── Nest ──
  const nestCoreMat = new THREE.MeshStandardMaterial({
    color: 0xb08a7a, roughness: 0.88, emissive: 0x2a0e08, emissiveIntensity: 0.9,
  });
  const nestPodMat = new THREE.MeshStandardMaterial({ color: 0xa17163, roughness: 0.95 });
  const core = new THREE.Mesh(new THREE.SphereGeometry(8.4, 24, 20), nestCoreMat);
  core.position.set(NEST_X, gy(NEST_X, NEST_Z) + 4.9, NEST_Z);
  scene.add(core);
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * Math.PI * 2;
    const r = 12 + rand() * 6;
    const px = NEST_X + Math.cos(a) * r;
    const pz = NEST_Z + Math.sin(a) * r;
    const p = new THREE.Mesh(new THREE.DodecahedronGeometry(2.1 + rand() * 1.2, 0), nestPodMat);
    p.position.set(px, gy(px, pz) + 1.2 + rand() * 0.4, pz);
    scene.add(p);
  }

  // ── Cart at spawn ──
  const rustyMat = new THREE.MeshStandardMaterial({ color: 0xc9c1b6, roughness: 0.7, metalness: 0.35 });
  const cartGroup = new THREE.Group();
  cartGroup.add(new THREE.Mesh(new THREE.BoxGeometry(4.2, 2.7, 6.2), rustyMat));
  const roof = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.35, 5.4), rustyMat);
  roof.position.y = 1.5;
  cartGroup.add(roof);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x20262e, roughness: 0.45, metalness: 0.6 });
  for (const wx of [-1.7, 1.7]) {
    for (const wz of [-2.4, 2.4]) {
      const w = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.35, 12), wheelMat);
      w.rotation.z = Math.PI / 2;
      w.position.set(wx, -1.18, wz);
      cartGroup.add(w);
    }
  }
  const spawnPt = trackPath.getPointAt(0);
  const spawnTan = trackPath.getTangentAt(0);
  cartGroup.position.set(spawnPt.x, gy(spawnPt.x, spawnPt.z) + 1.7, spawnPt.z);
  cartGroup.rotation.y = Math.atan2(spawnTan.x, spawnTan.z);
  scene.add(cartGroup);

  // ── Camera flyby path ──
  // Orbit the map at a slight angle, looking toward center
  const CAM_RADIUS = 200;
  const CAM_HEIGHT = 65;
  const CAM_SPEED = 0.015; // radians per second
  const CAM_LOOK = new THREE.Vector3(0, 0, -10);

  let elapsed = 0;
  const clock = new THREE.Clock();

  function onResize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  }
  window.addEventListener("resize", onResize);

  function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    elapsed += dt;

    const angle = elapsed * CAM_SPEED;
    camera.position.set(
      Math.cos(angle) * CAM_RADIUS,
      CAM_HEIGHT + Math.sin(elapsed * 0.04) * 10,
      Math.sin(angle) * CAM_RADIUS
    );
    camera.lookAt(CAM_LOOK);

    renderer.render(scene, camera);
  }
  animate();
})();
</script>

<!-- Auth logic -->
<script type="module">
import { signIn, signUp, signOut, getSession, getUser, getDisplayName, getMyStats, isConfigured } from "./src/supabase.js";

const authForm = document.getElementById("auth-form");
const authUser = document.getElementById("auth-user");
const authMsg = document.getElementById("auth-msg");
const authEmail = document.getElementById("auth-email");
const authPass = document.getElementById("auth-pass");
const authName = document.getElementById("auth-name");
const authNameRow = document.getElementById("auth-name-row");
const btnLogin = document.getElementById("btn-login");
const btnSignup = document.getElementById("btn-signup");
const btnLogout = document.getElementById("btn-logout");

if (!isConfigured()) {
  document.getElementById("auth-section").style.display = "none";
}

let isSignUpMode = false;

btnSignup.addEventListener("click", async () => {
  if (!isSignUpMode) {
    // First click: show name field and switch to sign-up mode
    isSignUpMode = true;
    authNameRow.style.display = "flex";
    authName.focus();
    btnSignup.textContent = "CREATE ACCOUNT";
    authMsg.textContent = "";
    return;
  }
  // Second click: actually sign up
  authMsg.textContent = "";
  const email = authEmail.value.trim();
  const pass = authPass.value;
  const name = authName.value.trim() || "Anonymous";
  if (!email || !pass) { authMsg.textContent = "Email and password required"; return; }
  if (pass.length < 6) { authMsg.textContent = "Password must be 6+ characters"; return; }
  try {
    await signUp(email, pass, name);
    authMsg.style.color = "#00e87a";
    authMsg.textContent = "Account created! Check your email to confirm, then login.";
  } catch (e) {
    authMsg.style.color = "#e84000";
    authMsg.textContent = e.message || "Sign up failed";
  }
});

btnLogin.addEventListener("click", async () => {
  authMsg.textContent = "";
  const email = authEmail.value.trim();
  const pass = authPass.value;
  if (!email || !pass) { authMsg.textContent = "Email and password required"; return; }
  try {
    await signIn(email, pass);
    showLoggedIn();
  } catch (e) {
    authMsg.style.color = "#e84000";
    authMsg.textContent = e.message || "Login failed";
  }
});

btnLogout.addEventListener("click", async () => {
  await signOut();
  showLoggedOut();
});

async function showLoggedIn() {
  const user = await getUser();
  if (!user) { showLoggedOut(); return; }
  authForm.style.display = "none";
  authUser.style.display = "flex";
  authUser.style.flexDirection = "column";
  authUser.style.alignItems = "center";
  authUser.style.gap = "10px";
  document.getElementById("user-greeting").textContent = `Welcome, ${getDisplayName(user)}`;

  const stats = await getMyStats();
  if (stats) {
    document.getElementById("stat-games").textContent = stats.games_played;
    document.getElementById("stat-shooter-wins").textContent = stats.shooter_wins;
    document.getElementById("stat-commander-wins").textContent = stats.commander_wins;
    document.getElementById("stat-kills").textContent = stats.total_kills;
    document.getElementById("stat-deaths").textContent = stats.total_deaths;
  }
}

function showLoggedOut() {
  authForm.style.display = "block";
  authUser.style.display = "none";
  isSignUpMode = false;
  authNameRow.style.display = "none";
  btnSignup.textContent = "SIGN UP";
  authMsg.textContent = "";
}

// Check if already logged in on page load
(async () => {
  if (!isConfigured()) return;
  const session = await getSession();
  if (session) showLoggedIn();
})();
</script>

<!-- Lobby logic -->
<script type="module">
import { getAvailableRooms, getAvailableArenaRooms } from "./src/network.js";

let selectedRole = null;

const btnFps = document.getElementById("btn-fps");
const btnRts = document.getElementById("btn-rts");
const btnArena = document.getElementById("btn-arena");
const btnCreate = document.getElementById("btn-create");
const roomNameInput = document.getElementById("room-name-input");
const roomListEl = document.getElementById("room-list");
const roomsHeader = document.getElementById("rooms-header");
const errorMsg = document.getElementById("error-msg");

// ── Role selection ──────────────────────────────────────────────────────
function selectRole(role) {
  selectedRole = role;
  btnFps.classList.toggle("active", role === "fps");
  btnRts.classList.toggle("active", role === "rts");
  btnArena.classList.toggle("active", role === "arena");
  btnCreate.disabled = false;
  roomsHeader.textContent = role === "arena" ? "Arena Rooms" : "Available Rooms";
  renderRooms(lastRooms);
}

btnFps.addEventListener("click", () => selectRole("fps"));
btnRts.addEventListener("click", () => selectRole("rts"));
btnArena.addEventListener("click", () => selectRole("arena"));

// ── Create room ─────────────────────────────────────────────────────────
btnCreate.addEventListener("click", () => {
  if (!selectedRole) return;
  const roomName = roomNameInput.value.trim() || (selectedRole === "arena" ? "Arena Room" : "Game Room");
  if (selectedRole === "arena") {
    const params = new URLSearchParams({ create: "true", roomName });
    window.location.href = `/arena.html?${params}`;
  } else {
    const page = selectedRole === "fps" ? "shooter_v2.html" : "rts.html";
    const params = new URLSearchParams({ create: "true", roomName, role: selectedRole });
    window.location.href = `/${page}?${params}`;
  }
});

// ── Room list polling ───────────────────────────────────────────────────
let lastRooms = [];

function renderRooms(rooms) {
  lastRooms = rooms;
  const isArenaMode = selectedRole === "arena";

  // Filter by type and waiting phase
  const waiting = rooms.filter(r => {
    const meta = r.metadata || {};
    if (meta.phase !== "waiting") return false;
    return isArenaMode ? !!meta.isArena : !meta.isArena;
  });

  if (waiting.length === 0) {
    roomListEl.innerHTML = '<div class="rooms-empty">No rooms available. Create one!</div>';
    return;
  }

  roomListEl.innerHTML = "";
  for (const room of waiting) {
    const meta = room.metadata || {};

    let disabled = !selectedRole;
    let itemHtml = "";

    if (isArenaMode) {
      const fpsCount = meta.fpsCount || 0;
      const full = fpsCount >= 4;
      disabled = disabled || full;
      itemHtml = `
        <div class="room-name">${escapeHtml(meta.roomName || "Arena Room")}</div>
        <div class="room-info">
          <span class="slot ${full ? "filled" : "open"}">FIGHTERS: ${fpsCount}/4</span>
          <span class="slot open" style="background:rgba(200,0,10,.18);color:#f88">ARENA</span>
        </div>
      `;
    } else {
      const fpsCount = meta.fpsCount || 0;
      const fpsFull = fpsCount >= 4;
      const rtsSlot = meta.hasRts ? "filled" : "open";
      const roleBlocked = selectedRole
        ? (selectedRole === "fps" && fpsFull) || (selectedRole === "rts" && meta.hasRts)
        : false;
      disabled = disabled || roleBlocked;
      itemHtml = `
        <div class="room-name">${escapeHtml(meta.roomName || "Game Room")}</div>
        <div class="room-info">
          <span class="slot ${fpsFull ? "filled" : "open"}">SHOOTERS: ${fpsCount}/4</span>
          <span class="slot ${rtsSlot}">COMMANDER: ${meta.hasRts ? "FILLED" : "OPEN"}</span>
        </div>
      `;
    }

    const item = document.createElement("div");
    item.className = "room-item" + (disabled ? " disabled" : "");
    item.innerHTML = itemHtml;

    if (!disabled) {
      item.addEventListener("click", () => {
        if (isArenaMode) {
          const params = new URLSearchParams({ roomId: room.roomId });
          window.location.href = `/arena.html?${params}`;
        } else {
          const page = selectedRole === "fps" ? "shooter_v2.html" : "rts.html";
          const params = new URLSearchParams({ roomId: room.roomId, role: selectedRole });
          window.location.href = `/${page}?${params}`;
        }
      });
    }

    roomListEl.appendChild(item);
  }
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

async function pollRooms() {
  try {
    const [gameRooms, arenaRooms] = await Promise.all([
      getAvailableRooms(),
      getAvailableArenaRooms(),
    ]);
    renderRooms([...gameRooms, ...arenaRooms]);
    errorMsg.textContent = "";
  } catch (err) {
    errorMsg.textContent = "Failed to fetch rooms: " + (err.message || err);
  }
}

pollRooms();
setInterval(pollRooms, 2000);

// ── Gamepad navigation for lobby ──────────────────────────────────────
(function lobbyGamepad() {
  let focusIndex = 0;
  let lastDpad = 0;
  let lastA = false;
  const REPEAT = 200;

  function getFocusables() {
    const items = [btnFps, btnRts, btnArena, roomNameInput, btnCreate];
    document.querySelectorAll(".room-item:not(.disabled)").forEach(el => items.push(el));
    return items;
  }

  function highlight(list, i) {
    list.forEach((el, j) => {
      if (j === i) el.classList.add("gp-focus");
      else el.classList.remove("gp-focus");
    });
  }

  function loop() {
    const gp = navigator.getGamepads ? navigator.getGamepads()[0] : null;
    if (gp) {
      const items = getFocusables();
      if (focusIndex >= items.length) focusIndex = Math.max(0, items.length - 1);
      const now = performance.now();
      const upDown = (gp.buttons[13] && gp.buttons[13].pressed ? 1 : 0)
                   - (gp.buttons[12] && gp.buttons[12].pressed ? 1 : 0);
      const stickY = Math.abs(gp.axes[1]) > 0.5 ? Math.sign(gp.axes[1]) : 0;
      const dir = upDown || stickY;
      if (dir && now - lastDpad > REPEAT) {
        focusIndex = (focusIndex + (dir > 0 ? 1 : items.length - 1)) % items.length;
        highlight(items, focusIndex);
        lastDpad = now;
      } else if (!dir) {
        lastDpad = 0;
      }
      const aPressed = gp.buttons[0] && gp.buttons[0].pressed;
      if (aPressed && !lastA) {
        const el = items[focusIndex];
        if (el.tagName === "INPUT") el.focus();
        else el.click();
      }
      lastA = aPressed;
      highlight(items, focusIndex);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js/+esm";
import * as SkeletonUtils from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/utils/SkeletonUtils.js/+esm";
import { getMyCustomization, saveCustomization } from "./src/supabase.js";

const modal = document.getElementById("customize-modal");
const canvas = document.getElementById("cust-canvas");
const btnCustomize = document.getElementById("btn-customize");
const btnSave = document.getElementById("cust-save");
const btnReset = document.getElementById("cust-reset");
const btnClose = document.getElementById("cust-close");
const custMsg = document.getElementById("cust-msg");

const baseInput = document.getElementById("cust-base");
const zones = ["head", "torso", "arms", "legs"];
const zoneChecks = {};
const zoneInputs = {};
zones.forEach(z => {
  zoneChecks[z] = document.getElementById(`cust-${z}-on`);
  zoneInputs[z] = document.getElementById(`cust-${z}`);
  zoneChecks[z].addEventListener("change", () => {
    zoneInputs[z].disabled = !zoneChecks[z].checked;
    updatePreview();
  });
  zoneInputs[z].addEventListener("input", updatePreview);
});
baseInput.addEventListener("input", updatePreview);

// Joint zone mapping (matches main.js)
const JOINT_ZONE = [];
for (let i = 0; i <= 58; i++) {
  if (i <= 2) JOINT_ZONE[i] = "torso";
  else if (i <= 4) JOINT_ZONE[i] = "head";
  else if (i <= 50) JOINT_ZONE[i] = "arms";
  else JOINT_ZONE[i] = "legs";
}

// 3D preview setup
let renderer, scene, camera, previewModel, animating = false;

function initPreview() {
  if (renderer) return;
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0e14);

  camera = new THREE.PerspectiveCamera(35, 1, 0.1, 50);
  camera.position.set(0, 1.0, 5.5);
  camera.lookAt(0, 0.8, 0);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x333344, 0.8));
  const dir = new THREE.DirectionalLight(0xffffff, 1);
  dir.position.set(2, 3, 2);
  scene.add(dir);

  // Floor grid
  const grid = new THREE.GridHelper(4, 8, 0x1a2a3a, 0x0d1520);
  scene.add(grid);
}

let humanGLTF = null;
async function loadModel() {
  if (humanGLTF) return;
  const loader = new GLTFLoader();
  humanGLTF = await new Promise((resolve, reject) => {
    loader.load("./assets/newshooter.glb", resolve, undefined, reject);
  });
}

function getColors() {
  const base = baseInput.value;
  const colors = { base };
  zones.forEach(z => {
    colors[z] = zoneChecks[z].checked ? zoneInputs[z].value : null;
  });
  return colors;
}

function applyZoneColorsPreview(model, customColors) {
  const base = new THREE.Color(customColors.base);
  const zoneColors = {
    head:  new THREE.Color(customColors.head || customColors.base),
    torso: new THREE.Color(customColors.torso || customColors.base),
    arms:  new THREE.Color(customColors.arms || customColors.base),
    legs:  new THREE.Color(customColors.legs || customColors.base),
  };

  model.traverse((obj) => {
    if (!obj.isMesh || !obj.geometry) return;
    const geo = obj.geometry;
    const joints = geo.getAttribute("skinIndex");
    if (!joints) {
      obj.material = new THREE.MeshStandardMaterial({ color: base, roughness: 0.6 });
      return;
    }
    const count = geo.getAttribute("position").count;
    const colors = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const jointIdx = joints.getX(i);
      const zone = JOINT_ZONE[jointIdx] || "torso";
      const c = zoneColors[zone];
      colors[i * 3] = c.r;
      colors[i * 3 + 1] = c.g;
      colors[i * 3 + 2] = c.b;
    }
    geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
    obj.material = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.6 });
  });
}

function updatePreview() {
  if (!previewModel) return;
  const colors = getColors();
  applyZoneColorsPreview(previewModel, colors);
}

let previewMixer = null;
function spawnPreviewModel() {
  if (previewModel) { scene.remove(previewModel); previewModel = null; }
  if (previewMixer) { previewMixer = null; }
  previewModel = SkeletonUtils.clone(humanGLTF.scene);
  previewModel.scale.setScalar(1.35);
  previewModel.rotation.y = 0; // face camera
  scene.add(previewModel);

  // Apply T-Pose for the character editor
  const clips = humanGLTF.animations;
  if (clips && clips.length > 0) {
    previewMixer = new THREE.AnimationMixer(previewModel);
    const tposeClip = THREE.AnimationClip.findByName(clips, "T-Pose")
      || THREE.AnimationClip.findByName(clips, "TPose")
      || THREE.AnimationClip.findByName(clips, "T_Pose")
      || THREE.AnimationClip.findByName(clips, "Tpose");
    if (tposeClip) {
      const action = previewMixer.clipAction(tposeClip);
      action.setLoop(THREE.LoopRepeat, Infinity);
      action.timeScale = 0; // freeze at first frame
      action.play();
      previewMixer.update(0);
    }
  }

  updatePreview();
}

function startAnimation() {
  if (animating) return;
  animating = true;
  const clock = new THREE.Clock();
  function animate() {
    if (!animating) return;
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    // Static front view — no rotation
    const rect = canvas.parentElement.getBoundingClientRect();
    const w = rect.width || 300;
    const h = rect.height || 400;
    if (canvas.width !== w * devicePixelRatio || canvas.height !== h * devicePixelRatio) {
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    renderer.render(scene, camera);
  }
  animate();
}

function stopAnimation() { animating = false; }

// Load saved customization into the UI
function loadIntoUI(data) {
  if (!data) return;
  if (data.base_color) baseInput.value = data.base_color;
  zones.forEach(z => {
    const key = z + "_color";
    if (data[key]) {
      zoneChecks[z].checked = true;
      zoneInputs[z].disabled = false;
      zoneInputs[z].value = data[key];
    } else {
      zoneChecks[z].checked = false;
      zoneInputs[z].disabled = true;
      zoneInputs[z].value = baseInput.value;
    }
  });
}

// Open modal
btnCustomize.addEventListener("click", async () => {
  modal.classList.add("open");
  initPreview();
  await loadModel();
  spawnPreviewModel();
  startAnimation();

  // Load saved data
  custMsg.textContent = "";
  const saved = await getMyCustomization();
  if (saved) loadIntoUI(saved);
  updatePreview();
});

// Close
btnClose.addEventListener("click", () => {
  modal.classList.remove("open");
  stopAnimation();
});
modal.addEventListener("click", (e) => {
  if (e.target === modal) { modal.classList.remove("open"); stopAnimation(); }
});

// Save
btnSave.addEventListener("click", async () => {
  const colors = getColors();
  const payload = {
    base_color: colors.base,
    head_color: colors.head,
    torso_color: colors.torso,
    arms_color: colors.arms,
    legs_color: colors.legs,
  };
  custMsg.textContent = "Saving...";
  custMsg.style.color = "#aaa";
  const ok = await saveCustomization(payload);
  if (ok) {
    custMsg.style.color = "#00e87a";
    custMsg.textContent = "Saved!";
  } else {
    custMsg.style.color = "#e84000";
    custMsg.textContent = "Failed to save";
  }
});

// Reset
btnReset.addEventListener("click", () => {
  baseInput.value = "#00cc44";
  zones.forEach(z => {
    zoneChecks[z].checked = false;
    zoneInputs[z].disabled = true;
    zoneInputs[z].value = "#00cc44";
  });
  updatePreview();
  custMsg.textContent = "";
});
</script>

<!-- Music toggle -->
<audio id="menu-music" src="./assets/music/menu.wav" loop preload="auto"></audio>
<button id="music-toggle" title="Toggle music">&#128264;</button>
<div id="gamepad-indicator" title="No gamepad detected"><span class="gp-icon">&#127918;</span><span id="gp-status">Not Connected</span></div>
<script>
(function() {
  const audio = document.getElementById("menu-music");
  const btn = document.getElementById("music-toggle");
  let playing = false;

  function startMusic() {
    audio.play().then(() => {
      playing = true;
      btn.innerHTML = "&#128264;";
      btn.classList.remove("muted");
    }).catch(() => {});
  }

  function stopMusic() {
    audio.pause();
    playing = false;
    btn.innerHTML = "&#128263;";
    btn.classList.add("muted");
  }

  btn.addEventListener("click", () => {
    if (playing) stopMusic(); else startMusic();
  });

  // Autoplay on first user interaction
  function autoplay() {
    if (!playing) startMusic();
    document.removeEventListener("click", autoplay);
    document.removeEventListener("keydown", autoplay);
  }
  document.addEventListener("click", autoplay);
  document.addEventListener("keydown", autoplay);
})();
</script>

<!-- Gamepad detection -->
<script>
(function() {
  const ind = document.getElementById("gamepad-indicator");
  const gpStatus = document.getElementById("gp-status");
  let knownConnected = false;

  function checkGamepads() {
    if (!navigator.getGamepads) return false;
    const gamepads = navigator.getGamepads();
    for (let i = 0; i < gamepads.length; i++) {
      if (gamepads[i] && gamepads[i].connected) return true;
    }
    return false;
  }

  function setStatus(connected) {
    knownConnected = connected;
    ind.classList.toggle("connected", connected);
    ind.title = connected ? "Gamepad connected" : "No gamepad detected";
    gpStatus.textContent = connected ? "Connected" : "Not Connected";
  }

  // These events are the most reliable way to detect gamepads
  window.addEventListener("gamepadconnected", () => setStatus(true));
  window.addEventListener("gamepaddisconnected", () => {
    // Re-check in case multiple controllers
    setStatus(checkGamepads());
  });

  // Also poll — some browsers don't fire events reliably
  // and getGamepads() only works after a button press in some browsers
  function poll() {
    setStatus(checkGamepads());
    requestAnimationFrame(poll);
  }
  requestAnimationFrame(poll);
})();
</script>
